
name: Finance Dashboard CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: adityaa2510/mini-finance-dashboard
  APP_PATH: "Finance dashboard app Docker/app/2135_mini_finance"

jobs:
  build:
    name: CI - Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Finance dashboard app Docker/app/2135_mini_finance
          file: ./Finance dashboard app Docker/app/2135_mini_finance/Dockerfile
          push: false
          tags: mini-finance-dashboard:ci-test

  publish:
    name: CD - Publish Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: ./Finance dashboard app Docker/app/2135_mini_finance
          file: ./Finance dashboard app Docker/app/2135_mini_finance/Dockerfile
          push: true
          tags: |
            adityaa2510/mini-finance-dashboard:latest
            adityaa2510/mini-finance-dashboard:sha-${{ github.sha }}

  deploy:
    name: Deploy to Vagrant Ubuntu VM
    runs-on: self-hosted
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Pull published image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login \
            --username "$DOCKERHUB_USERNAME" --password-stdin
          docker pull "$IMAGE_NAME:sha-${GITHUB_SHA}"

      - name: Replace running dashboard
        run: |
          docker rm -f finance-dashboard 2>/dev/null || true
          docker run -d \
            --name finance-dashboard \
            --restart unless-stopped \
            -p 8080:80 \
            "$IMAGE_NAME:sha-${GITHUB_SHA}"

      - name: Verify deployment
        run: |
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://localhost:8080/ >/dev/null; then
              echo "Dashboard is responding successfully."
              exit 0
            fi
            sleep 2
          done

          docker logs finance-dashboard
          exit 1
