
services:
  finance-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: adityaa2510/mini-finance-dashboard:2.0
    container_name: finance-dashboard
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
